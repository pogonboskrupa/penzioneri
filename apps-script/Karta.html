<!DOCTYPE html>
<html>
<head>
<base target="_top">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; }
  #okvir { display: flex; height: 100%; }
  #karta { flex: 1 1 auto; }
  #bocna { width: 340px; overflow-y: auto; border-left: 1px solid #ddd; padding: 10px 12px; }
  h3 { margin: 6px 0 8px; font-size: 15px; }
  .alatna { padding: 8px 12px; border-bottom: 1px solid #ddd; background: #fafafa;
            display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .alatna label { cursor: pointer; }
  .zbir { font-size: 13px; color: #333; margin-left: auto; }
  .stavka { border-bottom: 1px solid #eee; padding: 6px 0; font-size: 13px; cursor: pointer; }
  .stavka:hover { background: #f5f5f5; }
  .znak { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .crveno { background: #d93025; } .zuto { background: #f9ab00; } .zeleno { background: #188038; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  td { padding: 2px 4px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
  .gotov { color: #188038; } .ceka { color: #d93025; font-weight: bold; }
  .upozorenje { background: #fff4e5; border: 1px solid #f9ab00; padding: 6px 8px;
                font-size: 12px; margin-bottom: 8px; }
  a.nav { font-size: 12px; }
  .priblizno { font-size: 10px; color: #b26a00; font-weight: normal; }
  .nesvrstano-stavka { border-bottom: 1px solid #eee; padding: 6px 0; font-size: 13px; }
  .nesvrstano-stavka button { font-size: 12px; padding: 3px 8px; margin-top: 4px; cursor: pointer; }
  .nesvrstano-stavka button.aktivno { background: #d93025; color: #fff; border-color: #d93025; }
  #trakaPostavljanja { display: none; background: #d93025; color: #fff; padding: 6px 10px;
                       font-size: 13px; text-align: center; }
  .dugme-ispravi { font-size: 12px; padding: 4px 10px; margin-top: 6px; cursor: pointer;
                   border: 1px solid #1a73e8; color: #1a73e8; background: #fff; border-radius: 4px; }
  .dugme-ispravi.aktivno { background: #d93025; color: #fff; border-color: #d93025; }
  .kontekst-popup .leaflet-popup-content-wrapper { padding: 0; border-radius: 6px; }
  .kontekst-popup .leaflet-popup-content { margin: 0; }
  .kontekst-meni { display: flex; flex-direction: column; min-width: 160px; }
  .kontekst-meni button { border: 0; background: #fff; text-align: left; padding: 9px 14px;
                          font-size: 13px; cursor: pointer; border-bottom: 1px solid #eee; }
  .kontekst-meni button:last-child { border-bottom: 0; }
  .kontekst-meni button:hover { background: #f1f3f4; }
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;height:100%">
  <div class="alatna">
    <strong>Vrsta ogrjeva:</strong>
    <label><input type="radio" name="vrsta" value="SVE" checked> Obje</label>
    <label><input type="radio" name="vrsta" value="CIJEPANO"> Cijepano</label>
    <label><input type="radio" name="vrsta" value="U DUGOM"> U dugom</label>
    <label style="margin-left:12px"><input type="checkbox" id="samoPreostalo"> Prikaži samo ulice gdje je ostalo</label>
    <span class="zbir" id="zbir"></span>
  </div>
  <div id="trakaPostavljanja">Klikni na kartu tačno gdje treba da bude pin - odmah se snima.
    <button id="otkaziPostavljanje" style="margin-left:10px">Otkaži</button></div>
  <div id="okvir">
    <div id="karta"></div>
    <div id="bocna">
      <div id="upozorenje"></div>
      <div id="odjeljakNesvrstano"></div>
      <h3>Ulice (najviše preostalo prvo)</h3>
      <div id="spisak">Učitavanje…</div>
      <div id="detalji"></div>
    </div>
  </div>
</div>

<script>
var karta = L.map('karta').setView([44.88, 16.15], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap'
}).addTo(karta);

var sloj = L.layerGroup().addTo(karta);
var SVE = [], BEZ_KOORDINATA = [], postavljaSeKljuc = null;

function ucitajSve() {
  google.script.run.withSuccessHandler(function (odgovor) {
    SVE = odgovor.tacke || [];
    BEZ_KOORDINATA = odgovor.bezKoordinata || [];
    document.getElementById('upozorenje').innerHTML = BEZ_KOORDINATA.length
      ? '<div class="upozorenje">' + BEZ_KOORDINATA.length + ' ulica nema tačnu lokaciju - ' +
        'postavi ih ručno u spisku "Nesvrstano" ispod, ili pokreni "Geokodiraj ulice".</div>'
      : '';
    crtajNesvrstano();
    crtaj();
  }).withFailureHandler(function (e) {
    document.getElementById('spisak').textContent = 'Greška: ' + e.message;
  }).podaciZaKartu();
}
ucitajSve();

/** Spisak ulica bez (ili s pogrešnom) lokacijom - klik na dugme pa na kartu. */
function crtajNesvrstano() {
  var el = document.getElementById('odjeljakNesvrstano');
  if (!BEZ_KOORDINATA.length) { el.innerHTML = ''; return; }
  el.innerHTML = '<h3>Nesvrstano (' + BEZ_KOORDINATA.length + ')</h3>';
  BEZ_KOORDINATA.forEach(function (u) {
    var d = document.createElement('div');
    d.className = 'nesvrstano-stavka';
    d.innerHTML = '<strong>' + u.ulica + '</strong> <span style="color:#666">' + u.mjesto +
      '</span><br><button data-kljuc="' + u.kljuc.replace(/"/g, '&quot;') + '">Postavi pin</button>';
    d.querySelector('button').onclick = function (ev) {
      pokreniPostavljanje(u.kljuc, ev.target);
    };
    el.appendChild(d);
  });
}

/** Uključuje "klikni na kartu" način rada - koristi se i za ulice bez
 * lokacije (Nesvrstano) i za ispravku već postavljenog (pogrešnog) pina. */
function pokreniPostavljanje(kljuc, dugme) {
  resetujDugmadPostavljanja_();
  if (postavljaSeKljuc === kljuc) {           // ponovni klik - otkaži
    zavrsiPostavljanje();
    return;
  }
  karta.closePopup();
  postavljaSeKljuc = kljuc;
  if (dugme) { dugme.classList.add('aktivno'); dugme.textContent = 'Klikni na kartu…'; }
  document.getElementById('trakaPostavljanja').style.display = 'block';
  document.getElementById('karta').style.cursor = 'crosshair';
}

function resetujDugmadPostavljanja_() {
  document.querySelectorAll('.nesvrstano-stavka button, .dugme-ispravi').forEach(function (b) {
    b.classList.remove('aktivno');
    b.textContent = b.classList.contains('dugme-ispravi') ? '📍 Ispravi lokaciju' : 'Postavi pin';
  });
}

function zavrsiPostavljanje() {
  postavljaSeKljuc = null;
  document.getElementById('trakaPostavljanja').style.display = 'none';
  document.getElementById('karta').style.cursor = '';
  resetujDugmadPostavljanja_();
}

document.getElementById('otkaziPostavljanje').onclick = zavrsiPostavljanje;

karta.on('click', function (e) {
  if (!postavljaSeKljuc) return;
  var kljuc = postavljaSeKljuc;
  google.script.run.withSuccessHandler(function () {
    zavrsiPostavljanje();
    ucitajSve();
  }).withFailureHandler(function (err) {
    alert('Nije spremljeno: ' + err.message);
    zavrsiPostavljanje();
  }).spremiRucnuKoordinatu(kljuc, e.latlng.lat, e.latlng.lng);
});

function odabranaVrsta() {
  return document.querySelector('input[name=vrsta]:checked').value;
}

function zbirZa(tacka) {
  var v = odabranaVrsta();
  var preostalo = 0, isporuceno = 0, korisnici = [];
  Object.keys(tacka.vrste || {}).forEach(function (naziv) {
    if (v !== 'SVE' && v !== naziv) return;
    var d = tacka.vrste[naziv];
    preostalo += d.preostalo;
    isporuceno += d.isporuceno;
    d.korisnici.forEach(function (k) {
      korisnici.push({ vrsta: naziv, k: k });
    });
  });
  return {
    preostalo: Math.round(preostalo * 100) / 100,
    isporuceno: Math.round(isporuceno * 100) / 100,
    korisnici: korisnici
  };
}

/** Dvije boje: zelena = u potpunosti isporučeno, crvena = ima preostalo. */
function boja(z) {
  return z.preostalo <= 0.001 ? '#188038' : '#d93025';
}

function kratkaKategorija(k) {
  return k === 'PENZIONER' ? 'penz.' : k === 'SINDIKAT' ? 'sind.' : (k || '').toLowerCase();
}

function oznakaTacnosti(tacka) {
  if (tacka.tacnost === 'slično') {
    return ' <span class="priblizno">(približno, po sličnoj ulici' +
      (tacka.podudaranje ? ' "' + tacka.podudaranje + '"' : '') + ')</span>';
  }
  if (tacka.tacnost === 'naselje') return ' <span class="priblizno">(približno, centar naselja)</span>';
  if (tacka.tacnost === 'ručno') return ' <span class="priblizno">(ručno postavljeno)</span>';
  return '';
}

/** Kratak opis iznad markera: ulica, kubici i prva imena. */
function tooltipHtml(tacka, z) {
  var cekaju = z.korisnici.filter(function (r) { return r.k.preostalo > 0.001; });
  var imena = (cekaju.length ? cekaju : z.korisnici).slice(0, 3).map(function (r) {
    return r.k.ime + ' (' + kratkaKategorija(r.k.kategorija) + ')';
  }).join(', ');
  var ostatak = (cekaju.length ? cekaju : z.korisnici).length - 3;
  return '<strong>' + tacka.ulica + '</strong> · ' + tacka.mjesto + oznakaTacnosti(tacka) +
    '<br>ostalo <strong>' + z.preostalo + ' m3</strong>, isporučeno ' +
    z.isporuceno + ' m3' + (imena ? '<br>' + (cekaju.length ? 'čekaju: ' : '') +
    imena + (ostatak > 0 ? ' +' + ostatak : '') : '');
}

/** Puni spisak imena u oblačiću na karti. */
function popupHtml(tacka, z) {
  var html = '<div style="font-size:12px"><strong>' + tacka.ulica + ', ' +
    tacka.mjesto + '</strong>' + oznakaTacnosti(tacka) +
    '<br>ostalo ' + z.preostalo + ' m3 · isporučeno ' +
    z.isporuceno + ' m3<table style="margin-top:4px">';
  z.korisnici.slice().sort(function (a, b) { return b.k.preostalo - a.k.preostalo; })
    .forEach(function (r) {
      var k = r.k, gotov = k.preostalo <= 0.001 && k.isporuceno > 0;
      html += '<tr><td>' + (gotov ? '✓' : '●') + '</td><td><strong>' + k.ime +
        '</strong> <span style="color:#666">' + kratkaKategorija(k.kategorija) +
        ' · ' + r.vrsta + '</span></td><td>' +
        (gotov ? 'isporučeno ' + k.isporuceno + ' m3' +
                 (k.datum ? ' (' + k.datum + ')' : '')
               : 'ostalo ' + k.preostalo + ' m3') + '</td></tr>';
    });
  html += '</table><button class="dugme-ispravi" data-kljuc="' +
    String(tacka.kljuc).replace(/"/g, '&quot;') + '">📍 Ispravi lokaciju</button>';
  return html + '</div>';
}

// Dugme "Ispravi lokaciju" se ubacuje u DOM tek kad se popup otvori
// (Leaflet ga gradi iz HTML stringa), pa se klik hvata na taj događaj.
karta.on('popupopen', function (e) {
  var dugme = e.popup.getElement().querySelector('.dugme-ispravi');
  if (dugme) {
    dugme.onclick = function () { pokreniPostavljanje(dugme.getAttribute('data-kljuc'), dugme); };
  }
});

/** Desni klik na pin: mali meni "Info" / "Ispravi lokaciju". */
function prikaziKontekstniMeni(latlng, tacka, z) {
  var sadrzaj = '<div class="kontekst-meni">' +
    '<button id="kmInfo">ℹ️ Info</button>' +
    '<button id="kmIspravi">📍 Ispravi lokaciju</button></div>';
  L.popup({ closeButton: false, className: 'kontekst-popup', offset: [0, -4] })
    .setLatLng(latlng).setContent(sadrzaj).openOn(karta);
  document.getElementById('kmInfo').onclick = function () {
    karta.closePopup();
    prikaziDetalje(tacka, z);
  };
  document.getElementById('kmIspravi').onclick = function () {
    karta.closePopup();
    pokreniPostavljanje(tacka.kljuc, null);
  };
}

function crtaj() {
  sloj.clearLayers();
  var samoPreostalo = document.getElementById('samoPreostalo').checked;
  var redovi = [], ukupnoPreostalo = 0, ukupnoIsporuceno = 0;

  SVE.forEach(function (tacka) {
    if (tacka.lat === null || tacka.lng === null) return;  // nema koordinata
    var z = zbirZa(tacka);
    if (!z.korisnici.length) return;
    if (samoPreostalo && z.preostalo <= 0.001) return;
    ukupnoPreostalo += z.preostalo;
    ukupnoIsporuceno += z.isporuceno;

    var priblizno = tacka.tacnost === 'naselje' || tacka.tacnost === 'slično';
    var marker = L.circleMarker([tacka.lat, tacka.lng], {
      radius: Math.max(7, Math.min(26, 6 + Math.sqrt(z.preostalo) * 3)),
      color: priblizno ? '#5f6368' : '#fff', weight: priblizno ? 2 : 2,
      dashArray: priblizno ? '3,3' : null, fillColor: boja(z), fillOpacity: 0.85
    }).addTo(sloj);
    marker.bindTooltip(tooltipHtml(tacka, z), { direction: 'top' });
    marker.bindPopup(popupHtml(tacka, z), { maxWidth: 340, maxHeight: 320 });
    marker.on('click', function () { prikaziDetalje(tacka, z); });
    marker.on('contextmenu', function (e) {
      L.DomEvent.preventDefault(e.originalEvent);
      prikaziKontekstniMeni(e.latlng, tacka, z);
    });
    redovi.push({ tacka: tacka, z: z, marker: marker });
  });

  redovi.sort(function (a, b) { return b.z.preostalo - a.z.preostalo; });
  document.getElementById('zbir').textContent =
    'Ostalo: ' + Math.round(ukupnoPreostalo * 10) / 10 + ' m3  |  isporučeno: ' +
    Math.round(ukupnoIsporuceno * 10) / 10 + ' m3  |  ulica: ' + redovi.length;

  var spisak = document.getElementById('spisak');
  spisak.innerHTML = '';
  redovi.forEach(function (r) {
    var d = document.createElement('div');
    d.className = 'stavka';
    d.innerHTML = '<span class="znak" style="background:' + boja(r.z) + '"></span>' +
      '<strong>' + r.tacka.ulica + '</strong> <span style="color:#666">' +
      r.tacka.mjesto + '</span>' + oznakaTacnosti(r.tacka) +
      '<br>ostalo <strong>' + r.z.preostalo +
      ' m3</strong> · isporučeno ' + r.z.isporuceno + ' m3 · ' +
      r.z.korisnici.length + ' korisnika';
    d.onclick = function () {
      karta.setView([r.tacka.lat, r.tacka.lng], 16);
      r.marker.openTooltip();
      prikaziDetalje(r.tacka, r.z);
    };
    spisak.appendChild(d);
  });

  if (redovi.length) {
    karta.fitBounds(L.latLngBounds(redovi.map(function (r) {
      return [r.tacka.lat, r.tacka.lng];
    })).pad(0.15));
  }
}

function prikaziDetalje(tacka, z) {
  var html = '<h3>' + tacka.ulica + ', ' + tacka.mjesto + oznakaTacnosti(tacka) + '</h3>' +
    '<a class="nav" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=' +
    tacka.lat + ',' + tacka.lng + '">▸ Navigacija (Google Maps)</a><table>';
  z.korisnici.sort(function (a, b) { return b.k.preostalo - a.k.preostalo; });
  z.korisnici.forEach(function (r) {
    var k = r.k;
    var gotov = k.preostalo <= 0.001 && k.isporuceno > 0;
    html += '<tr><td class="' + (gotov ? 'gotov' : 'ceka') + '">' +
      (gotov ? '✓' : '●') + '</td><td><strong>' + k.ime + '</strong><br>' +
      '<span style="color:#666">' + kratkaKategorija(k.kategorija) + ' · ' +
      r.vrsta + (k.telefon ? ' · ' + k.telefon : '') +
      '</span></td><td>' + (gotov
        ? 'isporučeno ' + k.isporuceno + ' m3' + (k.datum ? '<br>' + k.datum : '') +
          (k.otpremnica ? '<br>otpr. ' + k.otpremnica : '')
        : 'ostalo <strong>' + k.preostalo + ' m3</strong>' +
          (k.isporuceno ? '<br>dio isporučen: ' + k.isporuceno + ' m3' : '')) +
      '</td></tr>';
  });
  html += '</table><button class="dugme-ispravi" data-kljuc="' +
    String(tacka.kljuc).replace(/"/g, '&quot;') + '">📍 Ispravi lokaciju</button>';
  document.getElementById('detalji').innerHTML = html;
  document.getElementById('detalji').querySelector('.dugme-ispravi').onclick = function (ev) {
    pokreniPostavljanje(tacka.kljuc, ev.target);
  };
}

document.querySelectorAll('input[name=vrsta]').forEach(function (el) {
  el.onchange = crtaj;
});
document.getElementById('samoPreostalo').onchange = crtaj;
</script>
</body>
</html>
